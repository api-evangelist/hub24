  name: HUB24 API Library
  description: HUB24's developer centre (developer.hub24.com.au) provides an API library for developers integrating with HUB24 infrastructure, with support available; access to the library requires registering or logging in, and HUB24 says it is updated on an ongoing basis. A 2017 HUB24 ASX release described an account-opening API that lets third-party software (financial planning, SMSF, robo-advice and licensee desktop software) create HUB24 investment and super accounts. No public contract or base URL is published; the portal answers anonymous clients with an Incapsula/hCaptcha challenge.
